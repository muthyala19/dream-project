<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Listing with Multiple Views</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: #f5f5f5;
}

.product-card {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  overflow: hidden;
}

.main-img-box {
  height: 450px;
  overflow: hidden;
}

.main-img-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}

/* Zoom effect */
.main-img-box:hover img {
  transform: scale(1.25);
}

.thumb-box {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 8px;
}

.thumb-box img {
  width: 45px;
  height: 45px;
  object-fit: cover;
  border: 1px solid #ccc;
  cursor: pointer;
  border-radius: 4px;
}

.thumb-box img:hover {
  border-color: #007bff;
}

.product-info {
  padding: 10px;
  text-align: center;
}

.product-title {
  font-weight: 600;
  font-size: 15px;
}

.product-price {
  color: #28a745;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container py-4">
  <h3 class="text-center mb-4">Products – 5 Views Each</h3>
  <div class="row" id="productList"></div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// JSON data
const products = [

  {

    ]
  },
  {

    ]
  },
  {

      "cw_images/1003_05.jpg"
    ]
  },
  {

      "cw_images/1004_03.jpg",

    ]
  },

      "cw_images/1008_05.jpg"
    ]
  }
];

$(document).ready(function () {
  let html = "";

  $.each(products, function (pIndex, product) {

    let thumbs = "";
    $.each(product.images, function (i, img) {
      thumbs += `<img src="${img}" data-target="main-${pIndex}">`;
    });

    html += `
      <div class="col-md-4 col-sm-6 mb-4">
        <div class="product-card">
          <div class="main-img-box">
            <img src="${product.images[0]}" id="main-${pIndex}">
          </div>

          <div class="thumb-box">
            ${thumbs}
          </div>

          <div class="product-info">
            <div class="product-title">${product.name}</div>
            <div class="product-price">${product.price}</div>
          </div>
        </div>
      </div>
    `;
  });

  $("#productList").html(html);

  // Thumbnail hover change main image
  $(".thumb-box img").on("mouseenter", function () {
    const imgSrc = $(this).attr("src");
    const target = $(this).data("target");
    $("#" + target).attr("src", imgSrc);
  });
});
</script>

</body>
</html>
