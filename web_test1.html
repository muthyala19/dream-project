<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Hide/Show Animation</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .animation-container {
            position: relative;
            width: 300px;
            height: 500px;
        }

        .svg-design {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .svg-shape {
            transition: opacity 1.2s ease-in-out;
            stroke: none;
        }

        .red { fill: #D92323; }
        .dark-red { fill: #8B0000; }

        .switchgear-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            border: 2px solid #8B0000;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }

        .switchgear-icon {
            width: 40px;
            height: 40px;
        }

        .switchgear-info p {
            font-weight: bold;
            color: #333;
            margin: 0;
            font-size: 20px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="animation-container">
        <svg viewBox="0 0 300 500" class="svg-design">
            <path id="shape1" class="svg-shape red" d="M 0 0 L 150 0 L 75 75 Z" />
            <path id="shape2" class="svg-shape dark-red" d="M 150 0 L 300 0 L 150 150 Z" />
            <path id="shape3" class="svg-shape red" d="M 0 0 L 75 75 L 0 150 Z" />
            <path id="shape4" class="svg-shape dark-red" d="M 75 75 L 150 150 L 75 225 Z" />
            <path id="shape5" class="svg-shape red" d="M 0 350 L 150 350 L 75 425 Z" />
        </svg>

        <div class="switchgear-info">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24" class="switchgear-icon">
                    <path fill="#8B0000" d="M21 4H3C1.9 4 1 4.9 1 6V18C1 19.1 1.9 20 3 20H21C22.1 20 23 19.1 23 18V6C23 4.9 22.1 4 21 4M10 18H5V6H10V18M11 18V6H16V18H11M17 18V6H22V18H17Z"/>
                </svg>
            </div>
            <p>Switchgear</p>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const shapes = [
                document.getElementById('shape1'),
                document.getElementById('shape2'),
                document.getElementById('shape3'),
                document.getElementById('shape4'),
                document.getElementById('shape5')
            ];
            
            // Initialize all shapes with opacity 0
            shapes.forEach(shape => shape.style.opacity = 0);
            
            let currentIndex = 0;
            
            function animateShapes() {
                // Show current shape
                shapes[currentIndex].style.opacity = 1;
                
                // Hide previous shape (with wrap-around)
                const prevIndex = (currentIndex - 1 + shapes.length) % shapes.length;
                shapes[prevIndex].style.opacity = 0;
                
                // Move to next shape
                currentIndex = (currentIndex + 1) % shapes.length;
                
                // Continue animation with delay
                setTimeout(animateShapes, 800);
            }
            
            // Start animation after a brief delay
            setTimeout(() => {
                // Show first shape initially
                shapes[0].style.opacity = 1;
                setTimeout(animateShapes, 1200);
            }, 500);
        });
    </script>
</body>
</html>
